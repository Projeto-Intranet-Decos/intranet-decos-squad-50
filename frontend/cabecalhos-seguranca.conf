# Headers de segurança das páginas e dos assets (GER-13, GER-23). Incluído em cada location que tem
# add_header próprio: no nginx, um add_header na location descarta os herdados do server.
#
# CSP: script só do próprio site. style-src aceita inline porque o sonner injeta um <style> ao
# subir. blob: em frame-src/object-src é a pré-visualização de documentos (iframe com blob: e o
# visualizador de PDF do navegador); data: em img-src são os filtros SVG do carrossel.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
