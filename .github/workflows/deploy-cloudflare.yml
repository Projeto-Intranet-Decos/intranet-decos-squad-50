# Deploy de produção no Cloudflare a cada push na main (ver cloudflare/README.md).
# O wrangler deploy gera a imagem do backend com o Docker do runner e publica Worker + Container.
name: Deploy Cloudflare

on:
  push:
    branches: [main]
  # Botão "Run workflow" na aba Actions, para refazer o deploy sem commit novo.
  workflow_dispatch:

# Um deploy por vez; o seguinte espera o anterior terminar em vez de cancelá-lo no meio.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # Build do frontend + wrangler deploy. Os segredos do backend já estão no Worker
      # (wrangler secret put); aqui só entram as credenciais do deploy.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
