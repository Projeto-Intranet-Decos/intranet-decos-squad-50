# Atualizações de dependência (GER-26). Semanais e agrupadas, para virar poucos PRs; correção de
# segurança o Dependabot abre na hora, fora desta agenda. Cada PR passa pelo CI antes do merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend:
        update-types: [minor, patch]

  # Imagens base fixadas por digest nos Dockerfiles e no compose: o Dependabot troca tag e digest
  # juntos quando sai uma imagem nova (inclusive a mesma tag reconstruída com correções).
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
