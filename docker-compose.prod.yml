# Produção: só a API e o frontend. O Postgres e o armazenamento (AWS S3, Cloudflare R2, MinIO
# próprio...) são externos e entram pelo .env (modelo em .env.prod.example).
# Uso: docker compose -f docker-compose.prod.yml up -d --build
name: intranet-hospital-prod

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?defina POSTGRES_HOST no .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Lido direto pelo libpq (psycopg2). Use require se o banco só aceitar conexão com TLS.
      PGSSLMODE: ${PGSSLMODE:-prefer}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      # Só o host (ex: s3.sa-east-1.amazonaws.com), sem https:// e sem o bucket.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?defina MINIO_ENDPOINT no .env}
      MINIO_USER: ${MINIO_USER:?defina MINIO_USER (Access Key ID) no .env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?defina MINIO_PASSWORD (Secret Access Key) no .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?defina MINIO_BUCKET no .env}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Intranet <nao-responda@localhost>}
      # Base dos links dos e-mails: tem que ser o endereço público do frontend.
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL no .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INVITE_HOURS: ${INVITE_HOURS:-72}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-60}
    # Sem porta publicada: a API só é acessada pelo nginx do frontend, em /api.

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
