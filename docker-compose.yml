name: intranet-hospital

services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intranet}
      POSTGRES_USER: ${POSTGRES_USER:-intranet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dados_banco:/var/lib/postgresql/data
    ports:
      - "${PORTA_BANCO:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  armazenamento:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-intranet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - dados_armazenamento:/data
    ports:
      - "${PORTA_MINIO:-9000}:9000"
      - "${PORTA_MINIO_CONSOLE:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-intranet}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@banco:5432/${POSTGRES_DB:-intranet}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ACCESS_TOKEN_MINUTOS: ${ACCESS_TOKEN_MINUTOS:-30}
      REFRESH_TOKEN_DIAS: ${REFRESH_TOKEN_DIAS:-7}
      MINIO_ENDPOINT: armazenamento:9000
      MINIO_USUARIO: ${MINIO_ROOT_USER:-intranet}
      MINIO_SENHA: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-intranet}
      EMAIL_PROVEDOR: ${EMAIL_PROVEDOR:-console}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-Intranet <nao-responda@localhost>}
      URL_FRONTEND: ${URL_FRONTEND:-http://localhost:8080}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMINIO: ${MAILGUN_DOMINIO:-}
      MAILGUN_URL_BASE: ${MAILGUN_URL_BASE:-https://api.mailgun.net}
      CONVITE_HORAS: ${CONVITE_HORAS:-72}
      REDEFINICAO_SENHA_MINUTOS: ${REDEFINICAO_SENHA_MINUTOS:-60}
    depends_on:
      banco:
        condition: service_healthy
      armazenamento:
        condition: service_healthy
    ports:
      - "${PORTA_BACKEND:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORTA_FRONTEND:-8080}:80"

volumes:
  dados_banco:
  dados_armazenamento:
